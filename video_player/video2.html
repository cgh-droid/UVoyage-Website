<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="menu">
        <a href="index.html"><button id="menu-button">Back to Home</button></a>
        <button id="toggle-ambience" onclick="toggleAmbient()">Ambient Video: On</button>
        <label for="lang-select">Choose a language:</label>
    <select id="lang-select">
        <option value="ja">Japanese</option>
        <option value="en">English</option>
    </select>
    </div>
<div id="video-container">  
    <div class="subtitle-section">
        <div id="subtitle-container">
                <div class="subtitle" id="subtitle1" onclick="alterTime(document.getElementById('video'), 15)">
                <h2 >[00:15]</h2>
                <p>引き抜くカセット</p>
            </div>
            <div class="subtitle" id="subtitle2" onclick="alterTime(document.getElementById('video'), 18)">
                <h2 >[00:18]</h2>
                <p>押し込むリセット</p>
            </div>
            <div class="subtitle" id="subtitle3" onclick="alterTime(document.getElementById('video'), 21)">
               <h2 >[00:21]</h2>
               <p>迷い込む迷路</p>
            </div>
            <div class="subtitle" id="subtitle4" onclick="alterTime(document.getElementById('video'), 24)">
               <h2 >[00:24]</h2>
               <p>進めどもダルセーニョ</p>
            </div>
            <div class="subtitle" id="subtitle5" onclick="alterTime(document.getElementById('video'), 26.5)">
                <h2 >[00:26]</h2>
                <p>ドアの先に僕の背中が見えた</p>
            </div>
            <div class="subtitle" id="subtitle6" onclick="alterTime(document.getElementById('video'), 29)">
                <h2 >[00:29]</h2>
                <p>振り向いた先に希望が見えた</p>
            </div>
            <div class="subtitle" id="subtitle7" onclick="alterTime(document.getElementById('video'), 32)">
                <h2 >[00:32]</h2>
                <p>地獄の果てなどどこにあるのか</p>
            </div>
            <div class="subtitle" id="subtitle8" onclick="alterTime(document.getElementById('video'), 35)">
                <h2 >[00:35]</h2>
                <p>出口はまだなの？</p>
            </div>
            </div>
        </div>
    <video width="960" height="540" controls id="video">
        <source src="./assets/video2.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <video width="960" height="540" muted playsinline id="video-ambient">
        <source src="./assets/video2.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

    <script>
        const video = document.getElementById('video');
        const ambientVideo = document.getElementById('video-ambient');
        const toggleButton = document.getElementById('toggle-subtitles');
        const subtitleSection = document.querySelector('.subtitle-section');
        const subtitleLabel = document.getElementById('subtitle-label');
        const subtitle1 = document.getElementById('subtitle1');
        const subtitle2 = document.getElementById('subtitle2');
        const subtitle3 = document.getElementById('subtitle3');
        const subtitle4 = document.getElementById('subtitle4');
        const subtitle5 = document.getElementById('subtitle5');
        const subtitle6 = document.getElementById('subtitle6');
        const subtitle7 = document.getElementById('subtitle7');
        const subtitle8 = document.getElementById('subtitle8');
        const langSelect = document.getElementById('lang-select');
        let ambientEnabled = true;
        let subtitlesEnabled = true;
        langSelect.addEventListener('change', () => {
            const selectedLang = langSelect.value;
            if (selectedLang === 'ja') {
                subtitle1.querySelector('p').textContent = '引き抜くカセット';
                subtitle2.querySelector('p').textContent = '押し込むリセット';
                subtitle3.querySelector('p').textContent = '迷い込む迷路';
                subtitle4.querySelector('p').textContent = '進めどもダルセーニョ';
                subtitle5.querySelector('p').textContent = 'ドアの先に僕の背中が見えた';
                subtitle6.querySelector('p').textContent = '振り向いた先に希望が見えた';
                subtitle7.querySelector('p').textContent = '地獄の果てなどどこにあるのか';
                subtitle8.querySelector('p').textContent = '出口はまだなの？';
            } else if (selectedLang === 'en') {
                subtitle1.querySelector('p').textContent = 'Pull out the cassette';
                subtitle2.querySelector('p').textContent = 'Push in the reset';
                subtitle3.querySelector('p').textContent = 'Lost in the maze';
                subtitle4.querySelector('p').textContent = 'Even if I go forward, it\'s a Dalseño';
                subtitle5.querySelector('p').textContent = 'I saw my back beyond the door';
                subtitle6.querySelector('p').textContent = 'I saw hope when I turned around';
                subtitle7.querySelector('p').textContent = 'Where is the end of hell?';
                subtitle8.querySelector('p').textContent = 'Isn\'t there an exit yet?';
            }
        });
        video.addEventListener('timeupdate', () => {
            const currentTime = video.currentTime;
            ambientVideo.currentTime = video.currentTime;
            currentTime >= 15  ? subtitle1.style.display = 'block' : subtitle1.style.display = 'none';
            currentTime >= 18 ? subtitle2.style.display = 'block' : subtitle2.style.display = 'none';
            currentTime >= 21? subtitle3.style.display = 'block' : subtitle3.style.display = 'none';
            currentTime >= 24  ? subtitle4.style.display = 'block' : subtitle4.style.display = 'none';
            currentTime >= 26.5 ? subtitle5.style.display = 'block' : subtitle5.style.display = 'none';
            currentTime >= 29 ? subtitle6.style.display = 'block' : subtitle6.style.display = 'none';
            currentTime >= 32 ? subtitle7.style.display = 'block' : subtitle7.style.display = 'none';
            currentTime >= 35 ? subtitle8.style.display = 'block' : subtitle8.style.display = 'none';
        });
        function toggleAmbient() {
            ambientEnabled = !ambientEnabled;
            const toggleButton = document.getElementById('toggle-ambience');
            if (ambientEnabled) {
                ambientVideo.style.opacity = 0.6;
                toggleButton.textContent = 'Ambient Video: On';
                toggleButton.style.backgroundColor = '#4CAF50'; // Change button color to green when on
            } else {
                ambientVideo.style.opacity = 0;
                toggleButton.textContent = 'Ambient Video: Off';
                toggleButton.style.backgroundColor = '#f44336'; // Change button color to red when off
            }
        }
        function alterTime(video, seconds) {
            video.currentTime = seconds;
            video.play();
        }
    </script>
</body>
</html>
