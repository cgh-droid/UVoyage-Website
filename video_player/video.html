<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="index.html"><button id="menu-button">Back to Home</button></a>

    <video width="640" height="360" fullscreen controls id="video">
        <source src="./assets/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <video width="640" height="360" muted playsinline id="video-ambient">
        <source src="./assets/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <h1>Subtitles</h1>
    <div reversed class="subtitle-section">
        
        <div class="subtitle" id="subtitle1" onclick="alterTime(document.getElementById('video'), 2)">
            <h2 >[00:02]</h2>
            <p>Hey, it's me, it's Verity!</p>
        </div>
        <div class="subtitle" id="subtitle2" onclick="alterTime(document.getElementById('video'), 5)">
            <h2 >[00:05]</h2>
            <p>Ask me ANYTHING!</p>
        </div>
        <div class="subtitle" id="subtitle3" onclick="alterTime(document.getElementById('video'), 9)">
            <h2 >[00:09]</h2>
            <p>I know about a million things.</p>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const ambientVideo = document.getElementById('video-ambient');
        const subtitle1 = document.getElementById('subtitle1');
        const subtitle2 = document.getElementById('subtitle2');
        const subtitle3 = document.getElementById('subtitle3');
        function alterTime(video, seconds) {
            video.currentTime = seconds;
            video.play();
        }
        video.addEventListener('timeupdate', () => {
            const currentTime = video.currentTime;
            ambientVideo.currentTime = currentTime;
            currentTime >= 2 ? subtitle1.style.display = 'block' : subtitle1.style.display = 'none';
            currentTime >= 5 ? subtitle2.style.display = 'block' : subtitle2.style.display = 'none';
            currentTime >= 9 ? subtitle3.style.display = 'block' : subtitle3.style.display = 'none';
        });
        
    </script>
</body>
</html>
