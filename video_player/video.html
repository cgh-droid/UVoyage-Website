<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="menu">
        <a href="index.html"><button id="menu-button">Back to Home</button></a>
        <button id="toggle-ambience" onclick="toggleAmbient()">Ambient Video: On</button>
    </div>

    <video width="960" height="540" fullscreen controls id="video">
        <source src="./assets/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <video width="960" height="540" muted playsinline id="video-ambient">
        <source src="./assets/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <h1 id="subtitle-label">Subtitles</h1>
    <div reversed class="subtitle-section">
        
        <div class="subtitle" id="subtitle1" onclick="alterTime(document.getElementById('video'), 2)">
            <h2 >[00:02]</h2>
            <p>Hey, it's me, it's Verity!</p>
        </div>
        <div class="subtitle" id="subtitle2" onclick="alterTime(document.getElementById('video'), 5)">
            <h2 >[00:05]</h2>
            <p>Ask me ANYTHING!</p>
        </div>
        <div class="subtitle" id="subtitle3" onclick="alterTime(document.getElementById('video'), 9)">
            <h2 >[00:09]</h2>
            <p>I know about a million things.</p>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const ambientVideo = document.getElementById('video-ambient');
        const toggleButton = document.getElementById('toggle-subtitles');
        const subtitleSection = document.querySelector('.subtitle-section');
        const subtitleLabel = document.getElementById('subtitle-label');
        const subtitle1 = document.getElementById('subtitle1');
        const subtitle2 = document.getElementById('subtitle2');
        const subtitle3 = document.getElementById('subtitle3');
        let ambientEnabled = true;
        let subtitlesEnabled = true;
        function alterTime(video, seconds) {
            video.currentTime = seconds;
            video.play();
        }
        function toggleAmbient() {
            ambientEnabled = !ambientEnabled;
            const toggleButton = document.getElementById('toggle-ambience');
            if (ambientEnabled) {
                ambientVideo.style.opacity = 0.6;
                toggleButton.textContent = 'Ambient Video: On';
                toggleButton.style.backgroundColor = '#4CAF50'; // Change button color to green when on
            } else {
                ambientVideo.style.opacity = 0;
                toggleButton.textContent = 'Ambient Video: Off';
                toggleButton.style.backgroundColor = '#f44336'; // Change button color to red when off
            }
        }
            subtitlesEnabled = !subtitlesEnabled;
            if (subtitlesEnabled) {
                for (let i = subtitleSection.children.length; i >= 0; i--) {
                    subtitleSection.children[i].style.display = 'block';
                }
                subtitleLabel.style.display = 'block';
                toggleButton.textContent = 'Subtitles: On';
                toggleButton.style.backgroundColor = '#4CAF50'; // Change button color to green when on
                
            } else {
                for (let i = 0; i < subtitleSection.children.length; i++) {
                    subtitleSection.children[i].style.display = 'none';
                }
                subtitleLabel.style.display = 'none';
                toggleButton.textContent = 'Subtitles: Off';
                toggleButton.style.backgroundColor = '#f44336'; // Change button color to red when off
                toggleButton.style.hover.backgroundColor = '#C6180B'; // Change button color to red when off
            }
        
        video.addEventListener('timeupdate', () => {
            const currentTime = video.currentTime;
            ambientVideo.currentTime = currentTime;
            currentTime >= 2 ? subtitle1.style.display = 'block'  : subtitle1.style.display = 'none';
            currentTime >= 5 ? subtitle2.style.display = 'block' : subtitle2.style.display = 'none';
            currentTime >= 9 ? subtitle3.style.display = 'block' : subtitle3.style.display = 'none';
        });
        
    </script>
</body>
</html>
